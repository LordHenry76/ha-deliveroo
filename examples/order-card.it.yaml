# Card ordine Deliveroo: intestazione con barra di avanzamento, timeline a 5 fasi, fase / orario di arrivo / codice rider.
#
# Richiede queste card (tutte disponibili in HACS):
#   - Mushroom            https://github.com/piitaya/lovelace-mushroom
#   - card-mod            https://github.com/thomasloven/lovelace-card-mod
#   - Vertical Stack In Card  https://github.com/ofekashery/vertical-stack-in-card
#
# ID DELLE ENTITÀ: questo file usa ID che iniziano con `sensor.deliveroo_` / `button.deliveroo_`.
# I tuoi contengono il nome dell'account (e l'area, se il dispositivo ne ha una), es. `sensor.deliveroo_alex_stato_ordine`.
# Controllali in Impostazioni > Entità (cerca "deliveroo") e fai cerca/sostituisci prima di incollare.
#
# Suggerimento: premi il pulsante "Simula ordine" dell'integrazione per vedere tutti gli stati della card.

type: custom:vertical-stack-in-card
cards:
  # ── Intestazione + barra di avanzamento ──
  - type: custom:mushroom-template-card
    entity: sensor.deliveroo_stato_ordine
    primary: >
      {% if is_state('sensor.deliveroo_stato_ordine', 'idle') %}Deliveroo
      {% elif has_value('sensor.deliveroo_ristorante') %}{{ states('sensor.deliveroo_ristorante') }}
      {% else %}Deliveroo{% endif %}
    secondary: >-
      {% set adv = state_attr('sensor.deliveroo_messaggio_stato', 'advisory') %}
      {% if is_state('sensor.deliveroo_stato_ordine', 'idle') %}Nessun ordine in corso
      {% elif has_value('sensor.deliveroo_messaggio_stato') %}{{ states('sensor.deliveroo_messaggio_stato') }}{{ '\n' ~ adv if adv else '' }}
      {% else %}Ordine in corso{% endif %}
    multiline_secondary: true
    icon: >
      {% set s = states('sensor.deliveroo_stato_ordine') %}
      {% set r = state_attr('sensor.deliveroo_stato_ordine', 'rider_route') %}
      {% if s == 'idle' %}mdi:moped-outline
      {% elif s == 'completed' %}mdi:home-heart
      {% elif s == 'failed' %}mdi:alert-circle
      {% elif r == 'TO_CUSTOMER' %}mdi:moped
      {% else %}mdi:chef-hat{% endif %}
    # Il ritardo è segnalato solo nel chip dell'orario, per non appesantire l'intestazione
    color: >
      {% set s = states('sensor.deliveroo_stato_ordine') %}
      {% if s == 'idle' %}grey
      {% elif s == 'failed' %}red
      {% else %}teal{% endif %}
    # Il tocco apre i tuoi ordini sul sito Deliveroo
    tap_action:
      action: url
      url_path: https://deliveroo.it/it/orders
    # La pressione prolungata controlla subito se c'è un nuovo ordine
    hold_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.deliveroo_aggiorna_ora
    card_mod:
      style: |
        {% set idle = is_state('sensor.deliveroo_stato_ordine', 'idle') %}
        ha-card {
          position: relative;
          padding-bottom: {{ '0' if idle else '14px' }} !important;
        }
        ha-card::after {
          {% set p = states('sensor.deliveroo_avanzamento') | int(0) %}
          {% if is_state('sensor.deliveroo_stato_ordine', 'completed') %}{% set p = 100 %}{% endif %}
          content: "";
          display: {{ 'none' if idle else 'block' }};
          position: absolute;
          left: 16px; right: 16px; bottom: 4px;
          height: 6px;
          border-radius: 3px;
          background: linear-gradient(90deg,
            #00ccbc {{ p }}%,
            rgba(127, 127, 127, 0.25) {{ p }}%);
        }

  # ── Timeline a 5 fasi (non cliccabile) ──
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.deliveroo_stato_ordine
        state_not: idle
    card:
      type: custom:mushroom-chips-card
      alignment: justify
      card_mod:
        style: |
          {% set i = state_attr('sensor.deliveroo_fase', 'step_index') | int(0) %}
          {% set done = is_state('sensor.deliveroo_stato_ordine', 'completed') %}
          {% set stop = 100 if done else ([i - 1, 0] | max) * 25 %}
          ha-card {
            position: relative;
            z-index: 0;
            padding: 8px 16px 4px !important;
            pointer-events: none;
            --chip-background: var(--ha-card-background, var(--card-background-color));
            --chip-border-width: 0;
            --chip-box-shadow: none;
          }
          ha-card::before {
            content: "";
            position: absolute;
            left: 34px; right: 34px;
            top: calc(50% + 2px);
            height: 2px;
            z-index: -1;
            background: linear-gradient(90deg,
              #00ccbc {{ stop }}%,
              rgba(127, 127, 127, 0.3) {{ stop }}%);
          }
      chips:
        # 1 · Ordine inviato
        - type: template
          icon: >
            {% set i = state_attr('sensor.deliveroo_fase', 'step_index') | int(0) %}
            {% set done = is_state('sensor.deliveroo_stato_ordine', 'completed') %}
            {{ 'mdi:check' if done or i > 1 else 'mdi:send' }}
          icon_color: >
            {% set i = state_attr('sensor.deliveroo_fase', 'step_index') | int(0) %}
            {% set done = is_state('sensor.deliveroo_stato_ordine', 'completed') %}
            {{ 'teal' if done or i >= 1 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.deliveroo_fase', 'step_index') | int(0) == 1 and not is_state('sensor.deliveroo_stato_ordine', 'completed') %}
              ha-card { --chip-background: color-mix(in srgb, #00ccbc 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}
        # 2 · Attesa conferma
        - type: template
          icon: >
            {% set i = state_attr('sensor.deliveroo_fase', 'step_index') | int(0) %}
            {% set done = is_state('sensor.deliveroo_stato_ordine', 'completed') %}
            {{ 'mdi:check' if done or i > 2 else 'mdi:store' }}
          icon_color: >
            {% set i = state_attr('sensor.deliveroo_fase', 'step_index') | int(0) %}
            {% set done = is_state('sensor.deliveroo_stato_ordine', 'completed') %}
            {{ 'teal' if done or i >= 2 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.deliveroo_fase', 'step_index') | int(0) == 2 and not is_state('sensor.deliveroo_stato_ordine', 'completed') %}
              ha-card { --chip-background: color-mix(in srgb, #00ccbc 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}
        # 3 · In preparazione
        - type: template
          icon: >
            {% set i = state_attr('sensor.deliveroo_fase', 'step_index') | int(0) %}
            {% set done = is_state('sensor.deliveroo_stato_ordine', 'completed') %}
            {{ 'mdi:check' if done or i > 3 else 'mdi:chef-hat' }}
          icon_color: >
            {% set i = state_attr('sensor.deliveroo_fase', 'step_index') | int(0) %}
            {% set done = is_state('sensor.deliveroo_stato_ordine', 'completed') %}
            {{ 'teal' if done or i >= 3 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.deliveroo_fase', 'step_index') | int(0) == 3 and not is_state('sensor.deliveroo_stato_ordine', 'completed') %}
              ha-card { --chip-background: color-mix(in srgb, #00ccbc 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}
        # 4 · In transito
        - type: template
          icon: >
            {% set i = state_attr('sensor.deliveroo_fase', 'step_index') | int(0) %}
            {% set done = is_state('sensor.deliveroo_stato_ordine', 'completed') %}
            {{ 'mdi:check' if done or i > 4 else 'mdi:moped' }}
          icon_color: >
            {% set i = state_attr('sensor.deliveroo_fase', 'step_index') | int(0) %}
            {% set done = is_state('sensor.deliveroo_stato_ordine', 'completed') %}
            {{ 'teal' if done or i >= 4 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.deliveroo_fase', 'step_index') | int(0) == 4 and not is_state('sensor.deliveroo_stato_ordine', 'completed') %}
              ha-card { --chip-background: color-mix(in srgb, #00ccbc 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}
        # 5 · Rider vicino / consegnato
        - type: template
          icon: >
            {% set done = is_state('sensor.deliveroo_stato_ordine', 'completed') %}
            {{ 'mdi:check' if done else 'mdi:map-marker' }}
          icon_color: >
            {% set i = state_attr('sensor.deliveroo_fase', 'step_index') | int(0) %}
            {% set done = is_state('sensor.deliveroo_stato_ordine', 'completed') %}
            {{ 'teal' if done or i >= 5 else 'disabled' }}
          tap_action: { action: none }
          hold_action: { action: none }
          double_tap_action: { action: none }
          card_mod:
            style: |
              {% if state_attr('sensor.deliveroo_fase', 'step_index') | int(0) == 5 and not is_state('sensor.deliveroo_stato_ordine', 'completed') %}
              ha-card { --chip-background: color-mix(in srgb, #00ccbc 25%, var(--ha-card-background, var(--card-background-color))); }
              {% endif %}

  # ── Fase, orario di arrivo, codice rider (non cliccabili) ──
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.deliveroo_stato_ordine
        state_not: idle
      - condition: state
        entity: sensor.deliveroo_stato_ordine
        state_not: completed
    card:
      type: custom:mushroom-chips-card
      alignment: center
      card_mod:
        style: |
          ha-card {
            padding: 4px 16px 12px !important;
            pointer-events: none;
          }
      chips:
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.deliveroo_fase
              state_not: unknown
          chip:
            type: template
            icon: mdi:timeline-check
            content: "{{ states('sensor.deliveroo_fase') }}"
            icon_color: teal
            tap_action: { action: none }
            hold_action: { action: none }
            double_tap_action: { action: none }
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.deliveroo_arrivo_stimato
              state_not: unknown
          chip:
            type: template
            icon: mdi:clock-outline
            content: >
              {% set e = state_attr('sensor.deliveroo_stato_ordine', 'eta_status') %}
              {{ states('sensor.deliveroo_arrivo_stimato') }}{{ ' · in ritardo' if e not in ['ON_TIME', none] else '' }}
            icon_color: >
              {% set e = state_attr('sensor.deliveroo_stato_ordine', 'eta_status') %}
              {{ 'orange' if e not in ['ON_TIME', none] else 'teal' }}
            tap_action: { action: none }
            hold_action: { action: none }
            double_tap_action: { action: none }
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.deliveroo_codice_rider
              state_not: unknown
          chip:
            type: template
            icon: mdi:key-variant
            content: "{{ states('sensor.deliveroo_codice_rider') }}"
            icon_color: amber
            tap_action: { action: none }
            hold_action: { action: none }
            double_tap_action: { action: none }
